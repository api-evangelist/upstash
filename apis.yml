aid: upstash
name: Upstash
description: >-
  Upstash provides serverless data platforms including managed Redis, Kafka,
  QStash messaging, and Vector databases optimized for serverless and edge
  applications with per-request pricing. The platform offers low-latency global
  replication, REST APIs for stateless access from edge runtimes, and SDKs for
  popular serverless frameworks. The Upstash Developer API enables programmatic
  management of databases, teams, and account resources using HTTP Basic
  authentication (email + API key).
